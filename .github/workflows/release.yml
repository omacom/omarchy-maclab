name: Release

# A Lab release. The owner pushes a tag on main: vX.Y.Z, or vX.Y.Z-rc.N for a
# Release candidate. The tag is the one number, stamped into omarchy-m-test,
# lab and labd.
#
# "macos" builds, on the one macOS runner with a pinned Xcode, the mini's
# reset tool from the source deploy/pins names and the macOS benchmark
# programs from release/bench-pins and tools/bench-macos/, and nothing else.
# "build", on the one arm64 Linux runner, builds Omarchy's benchmark
# programs the same way, then tests and builds every file with no secret
# and packs what both built. "publish" runs in the
# environment "release" (the owner as required reviewer, v* tags only), so it
# waits for the owner's approval: only then is the release key read, lab-agent
# and every file signed, and the GitHub Release made. A Release candidate is a
# pre-release and never "latest", so no install line offers it; vX.Y.Z becomes
# "latest", with the generated notes under the fixed lines of
# release/notes/X.Y.Z.txt when that file exists.
#
# release/local.sh does the same on one machine with a throwaway key.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    name: Build the reset tool and the macOS benchmark programs
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      BENCH_XCODE: Xcode 16.4
    steps:
      - uses: actions/checkout@v5
      - name: Build omacom/macvdmtool at its pinned commit and checksum
        run: release/reset-tool.sh "$RUNNER_TEMP/reset-tool"
      - name: Build the macOS benchmark programs from their pinned sources
        run: release/bench.sh darwin "$RUNNER_TEMP/bench/darwin-arm64"
      - name: One file, so the modes survive
        run: tar -cf "$RUNNER_TEMP/bench-darwin.tar" -C "$RUNNER_TEMP/bench" darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: reset-tool
          path: ${{ runner.temp }}/reset-tool/macvdmtool
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-darwin
          path: ${{ runner.temp }}/bench-darwin.tar
          if-no-files-found: error

  build:
    name: Build
    needs: macos
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag is a Lab release's and sits on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: |
          python cli/scripts/check_boundary.py
          (cd cli && python -m unittest discover -s tests -t .)
          go vet ./...
      - name: Build the versioned native GPU helper (no GPU execution)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libvulkan-dev glslang-tools spirv-tools
          cli/scripts/build_gpu_benchmark.sh "$RUNNER_TEMP/gpu-benchmark"
          echo "OMARCHY_GPU_BINARY_DIR=$RUNNER_TEMP/gpu-benchmark" >> "$GITHUB_ENV"
      - name: Build Omarchy's benchmark programs from their pinned sources
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          sudo apt-get install -y --no-install-recommends clang-18 cmake ocl-icd-opencl-dev
          release/bench.sh linux "$RUNNER_TEMP/bench/linux-arm64"
      - name: Check every file of a Lab release
        run: release/check.sh
      - uses: actions/download-artifact@v4
        with:
          name: reset-tool
          path: ${{ runner.temp }}/reset-tool
      - uses: actions/download-artifact@v4
        with:
          name: bench-darwin
          path: ${{ runner.temp }}
      - name: Unpack the macOS benchmark programs
        run: tar -xf "$RUNNER_TEMP/bench-darwin.tar" -C "$RUNNER_TEMP/bench"
      - name: Build
        run: LAB_RELEASE="$GITHUB_REF_NAME" RESET_TOOL="$RUNNER_TEMP/reset-tool/macvdmtool" BENCH_PROGRAMS="$RUNNER_TEMP/bench" release/build.sh dist
      - name: The bundle and the controller carry the reset tool
        run: |
          tar -tzf dist/lab-server-darwin-arm64.tar.gz | grep -qx lab-server/bin/macvdmtool
          tar -tzf dist/lab-controller-darwin-arm64.tar.gz | grep -qx lab-controller/bin/macvdmtool
      - name: Every benchmark program is there
        run: |
          . release/lib.sh
          for a in "${RELEASE_BENCH[@]}"; do
            p="${a#bench-}"
            p="${p%-*-arm64.tar.gz}"
            tar -tzf "dist/$a" | grep -qx "bench-$p/bin/$p"
          done
      - name: The macOS runner carries its install script and LaunchDaemon
        run: |
          tar -tzf dist/lab-macos-runner-darwin-arm64.tar.gz > "$RUNNER_TEMP/runner-files"
          for f in bin/lab-macos-runner install.sh org.omarchy.maclab.macos-runner.plist; do
            grep -qx "lab-macos-runner/$f" "$RUNNER_TEMP/runner-files"
          done
      - name: One file, so the modes survive
        run: tar -cf lab-release.tar -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: lab-release
          path: lab-release.tar
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lab-release
      - name: Unpack
        run: mkdir dist && tar -xf lab-release.tar -C dist
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/release-key"
          trap 'shred -u "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          release/sign.sh dist "$key"
      - name: Verify against the pinned release key
        run: release/verify.sh dist release/allowed_signers "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Omarchy Mac Lab ${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes "" \
              --prerelease --latest=false dist/*
          else
            fixed="release/notes/${GITHUB_REF_NAME#v}.txt"
            notes="$RUNNER_TEMP/notes"
            : > "$notes"
            if [[ -f $fixed ]]; then sed G "$fixed" > "$notes"; fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --generate-notes --notes-file "$notes" \
              --latest dist/*
          fi
