name: tests

# Everything that is tested, on every push and pull request. scripts/ci-local
# runs the same commands on a developer's machine.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  go:
    name: Go
    strategy:
      fail-fast: false
      matrix:
        # labd, oobd and lab-builder run on macOS; lab-agent runs on Linux.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: ShellCheck 0.11.0, the version the scripts' tests are written against
        # Ubuntu's own (0.9) reports info-level findings 0.11 does not.
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) arch=linux.x86_64 sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            macOS-ARM64) arch=darwin.aarch64 sum=56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79 ;;
            *) echo "no ShellCheck pinned for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          f="$RUNNER_TEMP/shellcheck.tar.xz"
          # GitHub's release downloads answer 502 now and then; the sum
          # below still checks whatever arrives.
          curl -fsSL --retry 5 --retry-all-errors -o "$f" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.$arch.tar.xz"
          echo "$sum  $f" | shasum -a 256 -c -
          tar -xJf "$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: go vet ./...
      - run: GOOS=linux GOARCH=arm64 go vet ./...
      - run: shellcheck --version
      - run: go test -race -timeout 40m ./...
      - run: make all
      - name: omarchy-m-test against this labd
        # Upload, the same report again and Preview's refusals; sign-in through the stand-in for GitHub, status, a Verified upload and sign-out.
        working-directory: cli
        run: OMARCHY_M_TEST_LABD="$PWD/../bin/labd" OMARCHY_M_TEST_FAKE_GITHUB="$PWD/../bin/fake-github" python3 -m unittest -v tests.test_lab_wire
      - name: labd on its own host and under a prefix
        run: |
          bash .github/scripts/labd-smoke.sh bin
          bash .github/scripts/labd-smoke.sh bin https://example.org/lab
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labd-smoke-log-${{ matrix.os }}
          path: ${{ runner.temp }}/labd-smoke.log
          if-no-files-found: ignore

  tools:
    name: Builder, boot-test and workflow tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # the bt2 fixtures need 3.14 (tarfile w:zst), as the Macs run
      - run: bash -n scripts/lab-only-autounlock
      - run: python3 scripts/test-lab-only-autounlock.py
      - run: python3 -B -m unittest discover -s builder -p 'test_*.py'
      - run: python3 -B -E -s -m unittest discover -s tests -v
        working-directory: tools/bt2
      - run: python3 -I -B -m unittest discover -s scripts/boot-test -p 'test_https_runtime.py' -v
      - run: python3 -I -B -m unittest discover -s scripts/workflow/m1 -p 'test_https_controller.py' -v

  spec:
    name: TLA+ specs
    # Today's design must pass, and each replayed bug must fail.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: make spec

  cli:
    name: omarchy-m-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Host boundary and stdlib-only imports
        run: python cli/scripts/check_boundary.py
      - name: Tests
        working-directory: cli
        run: python -m unittest discover -s tests -t . -v

  gpu-native:
    name: GPU helper compile and CPU-only guards
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies (CI only)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libvulkan-dev glslang-tools spirv-tools
      - name: Compile C and validate SPIR-V; no GPU invocation
        run: |
          cli/scripts/build_gpu_benchmark.sh "$RUNNER_TEMP/gpu-helper"
          "$RUNNER_TEMP/gpu-helper/gpu-benchmark-vulkan" --host-self-test
      - name: Preserve compile-only helper receipt
        uses: actions/upload-artifact@v4
        with:
          name: gpu-helper-${{ matrix.os }}
          path: ${{ runner.temp }}/gpu-helper/

  installer:
    name: Installer and release tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install, upgrade in place, refuse tampered and foreign-signed releases
        run: installer/test.sh
      - name: Every file of a Lab release, built unsigned, then signed with a throwaway key and verified
        run: release/check.sh
      - name: The smoke test against a labd started here, open, then the install line in Preview
        run: release/smoke-local.sh

  catalogue:
    name: Feature catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Asahi layer matches the pinned snapshot of Asahi's tables
        run: python catalogue/asahi_tables.py check

  schema:
    name: Report schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install check-jsonschema==0.33.0
      - name: Schema is valid draft 2020-12
        run: check-jsonschema --check-metaschema schema/*.schema.json
      - name: Golden reports validate
        run: check-jsonschema --schemafile schema/report-v1.schema.json schema/golden/*.json schema/golden/signed/*.json schema/golden/benchmarks/*.json

  site:
    name: Rails reference
    # Runs until the Go port passes its acceptance corpus and site/ is deleted.
    # Newer images only get the latest Ruby patch from setup-ruby, not site/.ruby-version's.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: site
          bundler-cache: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: The port writes the corpus of reports both will judge
        working-directory: .
        env:
          REPORT_PARITY_DIR: ${{ runner.temp }}/report-parity
        run: go test -count=1 -run TestVerdictsAreTheOldSites ./internal/reports
      - name: The port writes the seeded corpus both will count and render
        working-directory: .
        env:
          PAGE_PARITY_DIR: ${{ runner.temp }}/page-parity
        run: go test -count=1 -run TestTheCountsAreTheOldSites ./internal/reports
      - run: bin/rails db:test:prepare
      - run: bin/rails test
        env:
          REPORT_PARITY_DIR: ${{ runner.temp }}/report-parity
          PAGE_PARITY_DIR: ${{ runner.temp }}/page-parity
      - name: The port and the site judge that corpus alike
        working-directory: .
        env:
          REPORT_PARITY_VERDICTS: ${{ runner.temp }}/report-parity/rails-verdicts.jsonl
        run: go test -count=1 -run TestVerdictsAreTheOldSites ./internal/reports
      - name: The port and the site count that corpus alike
        working-directory: .
        env:
          PAGE_PARITY_AGGREGATION: ${{ runner.temp }}/page-parity/rails-aggregation.json
        run: go test -count=1 -run TestTheCountsAreTheOldSites ./internal/reports
      - name: The port's pages pin the elements the site's pages pin, and its exports are the site's
        working-directory: .
        env:
          PAGE_PARITY_DIR: ${{ runner.temp }}/page-parity
        run: go test -count=1 -run 'TestThePagesPinWhatTheOldSitesPin|TestTheExportsAreTheOldSites' ./internal/server
      # The import of the old site's reports, against the tables Rails made and
      # then against the committed SQL, which takes over when site/ is deleted.
      - name: The import reads the three tables from the Postgres Rails made
        working-directory: .
        env:
          LAB_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/omarchy_m_testing_test?sslmode=disable
          LAB_TEST_POSTGRES_SCHEMA: rails
        run: go test -count=1 -run TestTheReaderReadsARealPostgres ./internal/oldsite/pg
      - name: The import reads the three tables the committed SQL makes
        working-directory: .
        env:
          LAB_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/omarchy_m_testing_test?sslmode=disable
        run: go test -count=1 -run TestTheReaderReadsARealPostgres ./internal/oldsite/pg
      # The one verdict on the port: green here, and site/ and this job's Rails
      # steps can be deleted. It runs every part again, in one go.
      - name: The parity gate
        working-directory: .
        env:
          LAB_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/omarchy_m_testing_test?sslmode=disable
        run: scripts/parity-gate
